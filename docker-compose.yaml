services:
  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
      secrets:
        - sixlabors_license
    env_file:
      - ./docker/.env.backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command=Warning
    volumes:
      - ./docker/appsettings.backend.Production.json:/app/appsettings.Production.json:ro
      - backend-temp:/app/temp
    ports:
      - "5000:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./docker/.env.web
    ports:
      - "3000:3000"

secrets:
  sixlabors_license:
    file: ./apps/backend/sixlabors.lic

volumes:
  backend-temp:
